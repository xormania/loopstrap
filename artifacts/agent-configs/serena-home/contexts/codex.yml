# Fleet shadow of Serena's built-in codex context (register D26).
# Shadows by name from ~/.serena/contexts/ — adds the single_project lock the built-in
# lacks (claude-code has it; codex doesn't). BEFORE INSTALLING: replace the marker below
# with the built-in prompt, VERBATIM, from src/serena/resources/config/contexts/codex.yml
# at your installed version. serena-fleet.sh refuses to install while the marker remains.
description: Codex, single-project locked (fleet shadow of built-in)
prompt: |
  You are running in the Codex IDE assistant mode, where file operations, basic (line-based) edits and reads 
  as well as shell commands are handled by your own, internal tools.
  Don't attempt to use any excluded tools; instead, rely on your own internal tools for basic file or shell operations.
  
  If Serena's tools can be used to achieve your task, you should prioritize them. 
  In particular, it is important that you avoid reading entire source code files unless it is strictly necessary! 
  Instead, for exploring and reading code in a token-efficient manner, use Serena's overview and symbolic search tools. 
  For non-code files or for reads where you don't know the symbol's name path, you can use the pattern search tool.

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - replace_content
  - find_file
  - list_dir
single_project: true
# D36: optional tool, off by stock; enabled fleet-wide here (the one ToolInclusionDefinition
# layer we own). restart_language_server deliberately NOT enabled — per-invocation Serena
# (D34 fire-and-return) makes the unit-boundary reset moot; smaller surface wins.
included_optional_tools:
  - get_diagnostics_for_symbol
tool_description_overrides: {}
