# project-budget.toml — the budget schema, two beasts, tiered (ruled file, D50/D53/D54/D55)
# TWO CURRENCIES, NEVER SUMMED (D54). Ruled values override derived; changing a
# formula is the only ruling act and travels the courier (D47/D53).

# ── CLAUDE (the orchestrator / loop) ─────────────────────────────────────────
[claude]
family_tokens = 2400000000    # INTERIM (D55): was xor's "everything" number, kept
                              # as a safe Claude-side ceiling until he re-rules it
family_usd = 1000             # liberal, xor's standing license

[claude.per_repo]
# Optional per-repo Claude caps (D55). Absent member ⇒ tier dormant; family binds.
# lsp_math = <OUTPUT-token cap>   # xor rules per member; basis is OUTPUT tokens (D57)

# ── CODEX (the generator) ────────────────────────────────────────────────────
[codex]
[codex.per_repo]
# lsp_math = <OUTPUT-token cap>   # xor rules per member; basis is OUTPUT tokens (D57).
# ENFORCEMENT AUTO-ARMS at S1: the launch gate sums the ledger's numeric gen_tokens
# (NA lines skipped), so it bites the moment the field-map verifies.

# family_tokens =             # AWAITING: S1 verifies the token field-map, then
                              # xor's number (or the derive formula) fills this
