name: 'CI: pull request'

# Pull requests target dev. dev -> main is opened the same way and merged only by
# the owner.
on:
  pull_request:
    branches: [dev, main]
    # `edited` matters: without it a body-check failure cannot be fixed by fixing
    # the body. Re-running a workflow replays the original event payload, so the
    # stale body is what gets checked. That is a check with no path to green.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse cross-repository pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Cross-repository pull requests are not accepted." >&2
          echo "The battery runs committed tools, including a 24MB pinned CUE" >&2
          echo "binary, against a sealed tree. Ask for a branch." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          # Full history. A shallow clone has no merge base with the target
          # branch, so the changed-file diff fails — and an empty changed-file
          # list makes the red-before-green requirement apply to nothing. A
          # detection that fails open is worse than no detection.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tree verifies as sealed
        run: python3 artifacts/instance/tools/verify-tree.py .

      - name: Seal is regenerated and unchanged
        id: seal
        run: |
          # If this reports anything but UNCHANGED, the author edited files and
          # did not re-seal, so the manifest does not describe the tree.
          out="$(python3 artifacts/instance/tools/seal-tree.py .)"
          printf '%s\n' "$out"
          line="$(printf '%s\n' "$out" | grep -E 'UNCHANGED|SEAL CHANGED' || true)"
          if ! printf '%s' "$line" | grep -q 'UNCHANGED'; then
            echo "::error::the committed seal does not match the tree — run seal-tree.py and commit" >&2
            exit 1
          fi
          {
            echo "line<<EOF"
            printf '%s\n' "$out" | grep -E '^SEALED' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Contract gate
        id: contract
        run: |
          out="$(bash artifacts/instance/tools/contract-check.sh)"
          printf '%s\n' "$out"
          {
            echo "line<<EOF"
            printf '%s\n' "$out" | grep -E '^CONTRACT CLEAN' || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Battery
        id: battery
        run: |
          out="$(bash tests/battery.sh 2>&1)"
          printf '%s\n' "$out"
          clean="$(printf '%s\n' "$out" | sed 's/\x1b\[[0-9;]*m//g')"
          {
            echo "line<<EOF"
            printf '%s\n' "$clean" | grep -E '^[[:space:]]*[0-9]+ PASS' | head -1 | sed 's/^[[:space:]]*//'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Promotion is not a unit of review. Every commit reaching dev already
      # satisfied this check on its own pull request, with its own evidence and
      # its own red-before-green. Demanding the whole template again for dev ->
      # main re-proves work already proved, and re-proving is the ceremony this
      # repository keeps having to cut back.
      #
      # The battery, the contract gate and the seal still run. Only the BODY
      # requirement is skipped, and only for this one route.
      - name: Pull request body carries artifacts of the work
        if: >-
          !(github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.ref == 'dev')
        env:
          BODY: ${{ github.event.pull_request.body }}
          SEAL: ${{ steps.seal.outputs.line }}
          CONTRACT: ${{ steps.contract.outputs.line }}
          BATTERY: ${{ steps.battery.outputs.line }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > /tmp/pr-body.md
          base="${{ github.event.pull_request.base.ref }}"
          git fetch --quiet origin "$base"
          if ! mapfile -t changed < <(git diff --name-only "origin/$base...HEAD"); then
            echo "::error::could not diff against origin/$base" >&2
            exit 1
          fi
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "::error::changed-file list is empty; refusing to evaluate the" \
                 "red-before-green rule against nothing" >&2
            exit 1
          fi
          printf 'changed files (%s):\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"
          python3 artifacts/instance/tools/pr-evidence-check.py \
            --body-file /tmp/pr-body.md \
            --seal "$SEAL" \
            --contract "$CONTRACT" \
            --battery "$BATTERY" \
            --changed "${changed[@]}"
